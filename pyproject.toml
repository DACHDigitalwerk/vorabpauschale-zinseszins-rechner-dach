[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dach-vorabpauschale"
version = "2026.1.0"
authors = [
  { name="DACH Digitalwerk", email="dach.digitalwerk@gmail.com" },
]
description = "Präzisionsrechner für die Vorabpauschale gem. § 18 InvStG, Teilfreistellung nach § 20 InvStG, Zinseszins-Sparpläne und ETF-Besteuerung im DACH-Raum (DE / AT / CH)."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black",
    "flake8"
]

[project.scripts]
dach-vorabpauschale = "vorabpauschale_dach.cli:main"

[project.urls]
"Homepage" = "https://dachdigitalwerk.github.io/vorabpauschale-etf-rechner/"
"Bug Tracker" = "https://github.com/DACHDigitalwerk/vorabpauschale-zinseszins-rechner-dach/issues"
"Documentation" = "https://dachdigitalwerk.github.io/vorabpauschale-berechnen-formel-basiszins-2026.html"
